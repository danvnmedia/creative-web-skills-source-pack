version: 2
updates:
  - package-ecosystem: npm
    directory: /showcase-apps/asme-hero
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      showcase-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

